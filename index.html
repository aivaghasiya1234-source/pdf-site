<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Premium Download Site Pro</title>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    min-height:100vh;
    background:linear-gradient(-45deg,#0a0a0a,#121212,#1a1a1a,#111827);
    background-size:400% 400%;
    animation:bgMove 12s ease infinite;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
    color:#fff;
}

.container{
    width:560px;
    max-width:100%;
    background:rgba(255,255,255,0.08);
    border:1px solid rgba(255,255,255,0.15);
    backdrop-filter:blur(20px);
    border-radius:24px;
    padding:36px;
    box-shadow:0 25px 80px rgba(0,0,0,0.45);
    animation:fadeUp .8s ease;
}

h1{
    font-size:30px;
    margin-bottom:10px;
}

p{
    color:#d1d5db;
    margin-bottom:18px;
}

input{
    width:100%;
    padding:15px;
    border:none;
    border-radius:14px;
    margin:10px 0;
    background:rgba(255,255,255,0.08);
    color:white;
    outline:none;
    transition:.3s;
}

input:focus{
    transform:translateY(-2px);
    box-shadow:0 0 18px rgba(255,255,255,0.12);
}

button{
    width:100%;
    padding:14px;
    border:none;
    border-radius:14px;
    font-size:15px;
    cursor:pointer;
    margin:10px 0;
    transition:.3s;
}

button:hover{
    transform:translateY(-3px);
}

.blue{background:#2563eb;color:white;}
.green{background:#16a34a;color:white;}
.red{background:#dc2626;color:white;}
.gray{background:#374151;color:white;}

.hidden{display:none;}

.stats{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:12px;
    margin:20px 0;
}

.card{
    background:rgba(255,255,255,0.07);
    padding:16px;
    border-radius:16px;
    border:1px solid rgba(255,255,255,0.08);
}

.card h3{
    font-size:14px;
    color:#d1d5db;
}

.card span{
    display:block;
    margin-top:8px;
    font-size:22px;
    font-weight:bold;
}

.file-box{
    background:rgba(255,255,255,0.07);
    border:1px solid rgba(255,255,255,0.08);
    padding:15px;
    border-radius:14px;
    margin:12px 0;
    animation:fadeUp .5s ease;
}

.file-name{
    margin-bottom:10px;
    font-weight:600;
}

.badge{
    display:inline-block;
    font-size:12px;
    padding:6px 10px;
    border-radius:20px;
    background:rgba(37,99,235,0.2);
    margin-bottom:10px;
}

#fileList{
    max-height:320px;
    overflow-y:auto;
}

@keyframes fadeUp{
    from{opacity:0;transform:translateY(20px)}
    to{opacity:1;transform:translateY(0)}
}

@keyframes bgMove{
    0%{background-position:0% 50%}
    50%{background-position:100% 50%}
    100%{background-position:0% 50%}
}
</style>
</head>
<body>

<div class="container">

<div id="menuPage">
    <h1><i class="fa-solid fa-cloud-arrow-down"></i> Premium Vault</h1>
    <p>Professional Download Platform</p>

    <div class="stats">
        <div class="card">
            <h3>Total Files</h3>
            <span id="totalFiles">0</span>
        </div>
        <div class="card">
            <h3>Total Downloads</h3>
            <span id="totalDownloads">0</span>
        </div>
    </div>

    <button class="blue" onclick="openPasswordPage()">Admin Panel</button>
    <button class="green" onclick="openUserPanel()">User Panel</button>
</div>

<div id="passwordPage" class="hidden">
    <h1>Admin Login</h1>
    <p>Secure Access Required</p>
    <input type="password" id="adminPassword" placeholder="Enter Password">
    <button class="blue" onclick="checkPassword()">Login</button>
    <button class="gray" onclick="goHome()">Back</button>
    <p id="passStatus"></p>
</div>

<div id="adminPage" class="hidden">
    <h1>Admin Dashboard</h1>
    <p>Add New Download File</p>

    <input type="text" id="fileName" placeholder="File Name">
    <input type="text" id="fileCategory" placeholder="Category (PDF, Game, Movie)">
    <input type="text" id="fileLink" placeholder="Direct Download Link">

    <button class="green" onclick="addFile()">Add File</button>
    <button class="red" onclick="clearAll()">Clear All Files</button>
    <button class="gray" onclick="goHome()">Back</button>

    <p id="adminStatus"></p>
</div>

<div id="userPage" class="hidden">
    <h1>User Panel</h1>
    <p>Available Premium Files</p>

    <input type="text" id="searchBox" placeholder="Search files..." onkeyup="loadFiles()">

    <div id="fileList"></div>

    <button class="gray" onclick="goHome()">Back</button>
</div>

</div>

<script>
let files = JSON.parse(localStorage.getItem('files')) || [];
let totalDownloads = Number(localStorage.getItem('downloads')) || 0;

function saveFiles(){
    localStorage.setItem('files', JSON.stringify(files));
    localStorage.setItem('downloads', totalDownloads);
    updateStats();
}

function updateStats(){
    document.getElementById('totalFiles').innerText = files.length;
    document.getElementById('totalDownloads').innerText = totalDownloads;
}

function hideAll(){
    ['menuPage','passwordPage','adminPage','userPage'].forEach(id=>{
        document.getElementById(id).classList.add('hidden');
    });
}

function goHome(){
    hideAll();
    document.getElementById('menuPage').classList.remove('hidden');
    updateStats();
}

function openPasswordPage(){
    hideAll();
    document.getElementById('passwordPage').classList.remove('hidden');
}

function openUserPanel(){
    hideAll();
    document.getElementById('userPage').classList.remove('hidden');
    loadFiles();
}

function checkPassword(){
    const pass = document.getElementById('adminPassword').value;
    document.getElementById('passStatus').innerText = pass === '2008' ? (hideAll(), document.getElementById('adminPage').classList.remove('hidden'), '') : 'Wrong Password ❌';
}

function addFile(){
    const name = document.getElementById('fileName').value.trim();
    const category = document.getElementById('fileCategory').value.trim();
    const link = document.getElementById('fileLink').value.trim();
    const status = document.getElementById('adminStatus');

    if(!name || !category || !link){
        status.innerText = 'Fill all fields';
        return;
    }

    files.push({name, category, link});
    saveFiles();

    document.getElementById('fileName').value='';
    document.getElementById('fileCategory').value='';
    document.getElementById('fileLink').value='';

    status.innerText = 'File Added Successfully ✅';
}

function loadFiles(){
    const list = document.getElementById('fileList');
    const search = document.getElementById('searchBox').value.toLowerCase();

    let filtered = files.filter(file => file.name.toLowerCase().includes(search));

    if(filtered.length === 0){
        list.innerHTML = 'No Files Found';
        return;
    }

    list.innerHTML = '';

    filtered.forEach(file => {
        list.innerHTML += `
            <div class="file-box">
                <div class="badge">${file.category}</div>
                <div class="file-name">${file.name}</div>
                <a href="${file.link}" target="_blank" onclick="increaseDownload()">
                    <button class="green">Download Now</button>
                </a>
            </div>
        `;
    });
}

function increaseDownload(){
    totalDownloads++;
    saveFiles();
}

function clearAll(){
    files = [];
    saveFiles();
    document.getElementById('adminStatus').innerText = 'All Files Deleted ✅';
}

updateStats();
</script>

</body>
</html>

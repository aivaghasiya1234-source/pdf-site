<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Premium Dark Animated Download Site V2</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    min-height:100vh;
    background:linear-gradient(-45deg,#050505,#0f172a,#111827,#000000);
    background-size:400% 400%;
    animation:bgMove 12s ease infinite;
    color:#fff;
    padding:20px;
}

@keyframes bgMove{
    0%{background-position:0% 50%;}
    50%{background-position:100% 50%;}
    100%{background-position:0% 50%;}
}

.container{
    max-width:1100px;
    margin:auto;
}

.hero{
    background:rgba(255,255,255,0.07);
    border:1px solid rgba(255,255,255,0.12);
    backdrop-filter:blur(18px);
    border-radius:28px;
    padding:40px;
    box-shadow:0 20px 60px rgba(0,0,0,.4);
    margin-bottom:25px;
    text-align:center;
}

.hero h1{
    font-size:38px;
    margin-bottom:10px;
}

.hero p{
    color:#d1d5db;
    margin-bottom:20px;
}

.slider-text{
    font-size:22px;
    font-weight:bold;
    color:#60a5fa;
    min-height:35px;
}

.grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
    gap:18px;
    margin-bottom:25px;
}

.card{
    background:rgba(255,255,255,0.06);
    border:1px solid rgba(255,255,255,0.1);
    border-radius:22px;
    padding:22px;
    transition:.3s;
}

.card:hover{
    transform:translateY(-6px);
}

.card h3{
    margin-bottom:10px;
}

.card span{
    font-size:28px;
    font-weight:bold;
}

.panel{
    background:rgba(255,255,255,0.06);
    border:1px solid rgba(255,255,255,0.1);
    border-radius:24px;
    padding:30px;
    margin-bottom:25px;
}

input{
    width:100%;
    padding:15px;
    margin:10px 0;
    border:none;
    border-radius:14px;
    background:rgba(255,255,255,0.08);
    color:#fff;
    outline:none;
}

button{
    width:100%;
    padding:14px;
    border:none;
    border-radius:14px;
    cursor:pointer;
    font-size:15px;
    margin:10px 0;
    transition:.3s;
}

button:hover{
    transform:scale(1.02);
}

.blue{background:#2563eb;color:#fff;}
.green{background:#16a34a;color:#fff;}
.red{background:#dc2626;color:#fff;}
.gray{background:#374151;color:#fff;}
.hidden{display:none;}

.file-box{
    background:rgba(255,255,255,0.06);
    border-radius:18px;
    padding:18px;
    margin:15px 0;
}

.badge{
    display:inline-block;
    padding:6px 12px;
    border-radius:30px;
    background:rgba(37,99,235,.2);
    font-size:12px;
    margin-bottom:10px;
}

.file-name{
    font-size:18px;
    font-weight:600;
    margin-bottom:12px;
}

.status{
    margin-top:10px;
    color:#93c5fd;
}
</style>
</head>
<body>

<div class="container">

<div class="hero">
    <h1><i class="fa-solid fa-cloud-arrow-down"></i> Premium Vault Pro</h1>
    <p>Dark Animated Dynamic Download Platform</p>
    <div class="slider-text" id="sliderText">Premium Downloads</div>
</div>

<div class="grid">
    <div class="card">
        <h3>Total Files</h3>
        <span id="totalFiles">0</span>
    </div>

    <div class="card">
        <h3>Total Downloads</h3>
        <span id="totalDownloads">0</span>
    </div>
</div>

<div class="panel" id="mainPanel">
    <h2>Admin Add File</h2>

    <input type="text" id="fileName" placeholder="File Name">
    <input type="text" id="fileCategory" placeholder="Category">
    <input type="text" id="fileLink" placeholder="Direct Download Link">

    <button class="green" onclick="addFile()">Add File</button>
    <button class="red" onclick="clearAll()">Delete All Files</button>

    <p class="status" id="adminStatus"></p>
</div>

<div class="panel">
    <h2>User Download Panel</h2>

    <input type="text" id="searchBox" placeholder="Search files..." onkeyup="loadFiles()">

    <div id="fileList"></div>
</div>

</div>

<script>
let files = JSON.parse(localStorage.getItem('files')) || [];
let totalDownloads = Number(localStorage.getItem('downloads')) || 0;

const sliderWords = [
    "Premium Downloads",
    "VIP Access Files",
    "Latest Premium Content",
    "Fast Direct Downloads"
];

let slideIndex = 0;

function startSlider(){
    setInterval(()=>{
        slideIndex = (slideIndex + 1) % sliderWords.length;
        document.getElementById('sliderText').innerText = sliderWords[slideIndex];
    },2000);
}

function saveData(){
    localStorage.setItem('files', JSON.stringify(files));
    localStorage.setItem('downloads', totalDownloads);
    updateStats();
}

function updateStats(){
    document.getElementById('totalFiles').innerText = files.length;
    document.getElementById('totalDownloads').innerText = totalDownloads;
}

function addFile(){
    let name = document.getElementById('fileName').value.trim();
    let category = document.getElementById('fileCategory').value.trim();
    let link = document.getElementById('fileLink').value.trim();

    if(!name || !category || !link){
        document.getElementById('adminStatus').innerText = 'Please fill all fields';
        return;
    }

    files.push({name, category, link});
    saveData();
    loadFiles();

    document.getElementById('fileName').value = '';
    document.getElementById('fileCategory').value = '';
    document.getElementById('fileLink').value = '';

    document.getElementById('adminStatus').innerText = 'File Added Successfully ✅';
}

function loadFiles(){
    let list = document.getElementById('fileList');
    let search = document.getElementById('searchBox').value.toLowerCase();

    let filtered = files.filter(file =>
        file.name.toLowerCase().includes(search)
    );

    if(filtered.length === 0){
        list.innerHTML = 'No Files Found';
        return;
    }

    list.innerHTML = '';

    filtered.forEach(file=>{
        list.innerHTML += `
            <div class="file-box">
                <div class="badge">${file.category}</div>
                <div class="file-name">${file.name}</div>
                <a href="${file.link}" target="_blank" onclick="increaseDownload()">
                    <button class="blue">Download Now</button>
                </a>
            </div>
        `;
    });
}

function increaseDownload(){
    totalDownloads++;
    saveData();
}

function clearAll(){
    files = [];
    saveData();
    loadFiles();
    document.getElementById('adminStatus').innerText = 'All Files Deleted ✅';
}

updateStats();
loadFiles();
startSlider();
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Premium Download Site Pro</title>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}
body{
    min-height:100vh;
    background:linear-gradient(-45deg,#0a0a0a,#121212,#1a1a1a,#111827);
    background-size:400% 400%;
    animation:bgMove 12s ease infinite;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
    color:#fff;
}
.container{
    width:560px;
    max-width:100%;
    background:rgba(255,255,255,.08);
    border:1px solid rgba(255,255,255,.15);
    backdrop-filter:blur(20px);
    border-radius:24px;
    padding:36px;
    box-shadow:0 25px 80px rgba(0,0,0,.45);
}
h1{
    font-size:30px;
    margin-bottom:10px;
}
p{
    color:#d1d5db;
    margin-bottom:18px;
}
input{
    width:100%;
    padding:15px;
    border:none;
    border-radius:14px;
    margin:10px 0;
    background:rgba(255,255,255,.08);
    color:#fff;
    outline:none;
}
button{
    width:100%;
    padding:14px;
    border:none;
    border-radius:14px;
    font-size:15px;
    cursor:pointer;
    margin:10px 0;
}
.blue{background:#2563eb;color:#fff;}
.green{background:#16a34a;color:#fff;}
.red{background:#dc2626;color:#fff;}
.gray{background:#374151;color:#fff;}

.hidden{display:none;}

.stats{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:12px;
    margin:20px 0;
}
.card{
    background:rgba(255,255,255,.07);
    padding:16px;
    border-radius:16px;
}
.card span{
    display:block;
    margin-top:8px;
    font-size:22px;
    font-weight:bold;
}
.file-box{
    background:rgba(255,255,255,.07);
    padding:15px;
    border-radius:14px;
    margin:12px 0;
}
.file-name{
    margin:10px 0;
    font-weight:600;
}
.badge{
    display:inline-block;
    font-size:12px;
    padding:6px 10px;
    border-radius:20px;
    background:rgba(37,99,235,.2);
}
#fileList{
    max-height:320px;
    overflow-y:auto;
}
#idleBox{
    margin-top:10px;
    color:#facc15;
    font-size:14px;
}

@keyframes bgMove{
0%{background-position:0% 50%}
50%{background-position:100% 50%}
100%{background-position:0% 50%}
}
</style>
</head>
<body>

<div class="container">

<!-- HOME -->
<div id="menuPage">
<h1><i class="fa-solid fa-cloud-arrow-down"></i> Premium Vault</h1>
<p>Professional Download Platform</p>

<div class="stats">
<div class="card">
<h3>Total Files</h3>
<span id="totalFiles">0</span>
</div>

<div class="card">
<h3>Total Downloads</h3>
<span id="totalDownloads">0</span>
</div>
</div>

<button class="blue" onclick="openPasswordPage()">Admin Panel</button>
<button class="green" onclick="openUserPanel()">User Panel</button>
<div id="idleBox"></div>
</div>

<!-- PASSWORD -->
<div id="passwordPage" class="hidden">
<h1>Secure Access</h1>
<p>Password Required</p>

<input type="password" id="sitePassword" placeholder="Enter Password">
<button class="blue" onclick="verifyMainPassword()">Enter</button>
<button class="gray" onclick="goHome()">Back</button>

<p id="passStatus"></p>
</div>

<!-- ADMIN -->
<div id="adminPage" class="hidden">
<h1>Admin Dashboard</h1>

<input type="text" id="fileName" placeholder="File Name">
<input type="text" id="fileCategory" placeholder="Category">
<input type="text" id="fileLink" placeholder="Direct Link">

<button class="green" onclick="addFile()">Add File</button>
<button class="red" onclick="clearAll()">Delete All</button>
<button class="gray" onclick="goHome()">Back</button>

<p id="adminStatus"></p>
</div>

<!-- USER -->
<div id="userPage" class="hidden">
<h1>User Panel</h1>
<p>Available Files</p>

<input type="text" id="searchBox" placeholder="Search..." onkeyup="loadFiles()">
<div id="fileList"></div>

<button class="gray" onclick="goHome()">Back</button>
</div>

</div>

<script>
/* =========================
   DATA
========================= */
let files = JSON.parse(localStorage.getItem("files")) || [];
let totalDownloads = Number(localStorage.getItem("downloads")) || 0;

/* =========================
   PASSWORD
========================= */
const SITE_PASSWORD = "root2008";

/* =========================
   SAVE / LOAD
========================= */
function saveFiles(){
    localStorage.setItem("files", JSON.stringify(files));
    localStorage.setItem("downloads", totalDownloads);
    updateStats();
}

function updateStats(){
    document.getElementById("totalFiles").innerText = files.length;
    document.getElementById("totalDownloads").innerText = totalDownloads;
}

/* =========================
   PAGE CONTROL
========================= */
function hideAll(){
    ["menuPage","passwordPage","adminPage","userPage"].forEach(id=>{
        document.getElementById(id).classList.add("hidden");
    });
}

function goHome(){
    hideAll();
    document.getElementById("menuPage").classList.remove("hidden");
}

function openPasswordPage(){
    hideAll();
    document.getElementById("passwordPage").classList.remove("hidden");
}

function openUserPanel(){
    hideAll();
    document.getElementById("userPage").classList.remove("hidden");
    loadFiles();
}

/* =========================
   PASSWORD CHECK
========================= */
function verifyMainPassword(){
    let pass = document.getElementById("sitePassword").value;
    let msg = document.getElementById("passStatus");

    if(pass === SITE_PASSWORD){
        hideAll();
        document.getElementById("adminPage").classList.remove("hidden");
        msg.innerText = "";
    }else{
        msg.innerText = "Wrong Password ❌";
    }
}

/* =========================
   FILE SYSTEM
========================= */
function addFile(){
    let name = fileName.value.trim();
    let category = fileCategory.value.trim();
    let link = fileLink.value.trim();

    if(!name || !category || !link){
        adminStatus.innerText = "Fill all fields";
        return;
    }

    files.push({name,category,link});
    saveFiles();

    fileName.value="";
    fileCategory.value="";
    fileLink.value="";

    adminStatus.innerText="File Added Successfully ✅";
}

function loadFiles(){
    let search = searchBox.value.toLowerCase();
    let list = document.getElementById("fileList");

    let filtered = files.filter(f =>
        f.name.toLowerCase().includes(search)
    );

    if(filtered.length===0){
        list.innerHTML="No Files Found";
        return;
    }

    list.innerHTML="";

    filtered.forEach(file=>{
        list.innerHTML += `
        <div class="file-box">
            <div class="badge">${file.category}</div>
            <div class="file-name">${file.name}</div>
            <a href="${file.link}" target="_blank" onclick="increaseDownload()">
                <button class="green">Download</button>
            </a>
        </div>`;
    });
}

function increaseDownload(){
    totalDownloads++;
    saveFiles();
}

function clearAll(){
    files=[];
    saveFiles();
    adminStatus.innerText="All Files Deleted ✅";
}

/* =========================
   AUTO CLOSE AFTER 20 SEC
========================= */
let idleTimer;
let count = 20;

function startIdle(){
    resetIdle();

    ["mousemove","click","keydown","scroll","touchstart"].forEach(evt=>{
        document.addEventListener(evt, resetIdle);
    });
}

function resetIdle(){
    clearTimeout(idleTimer);
    count = 20;

    idleTimer = setTimeout(()=>{
        autoCloseTab();
    },20000);
}

function autoCloseTab(){
    document.body.innerHTML = `
    <div style="display:flex;justify-content:center;align-items:center;height:100vh;background:#000;color:#fff;font-family:Arial">
        <div style="text-align:center">
            <h1>Session Closed</h1>
            <p>20 sec no activity detected</p>
        </div>
    </div>
    `;

    window.open('','_self');
    window.close();
}

/* =========================
   START
========================= */
updateStats();
goHome();
startIdle();
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Premium Download Site Pro</title>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}
body{
    min-height:100vh;
    background:linear-gradient(-45deg,#0a0a0a,#121212,#1a1a1a,#111827);
    background-size:400% 400%;
    animation:bgMove 12s ease infinite;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
    color:#fff;
}
.container{
    width:560px;
    max-width:100%;
    background:rgba(255,255,255,.08);
    border:1px solid rgba(255,255,255,.15);
    backdrop-filter:blur(20px);
    border-radius:24px;
    padding:36px;
    box-shadow:0 25px 80px rgba(0,0,0,.45);
}
h1{
    font-size:30px;
    margin-bottom:10px;
}
p{
    color:#d1d5db;
    margin-bottom:18px;
}
input{
    width:100%;
    padding:15px;
    border:none;
    border-radius:14px;
    margin:10px 0;
    background:rgba(255,255,255,.08);
    color:#fff;
    outline:none;
}
button{
    width:100%;
    padding:14px;
    border:none;
    border-radius:14px;
    font-size:15px;
    cursor:pointer;
    margin:10px 0;
}
.blue{background:#2563eb;color:#fff;}
.green{background:#16a34a;color:#fff;}
.red{background:#dc2626;color:#fff;}
.gray{background:#374151;color:#fff;}
.hidden{display:none;}

.stats{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:12px;
    margin:20px 0;
}
.card{
    background:rgba(255,255,255,.07);
    padding:16px;
    border-radius:16px;
}
.card span{
    display:block;
    margin-top:8px;
    font-size:22px;
    font-weight:bold;
}
.file-box{
    background:rgba(255,255,255,.07);
    padding:15px;
    border-radius:14px;
    margin:12px 0;
}
.file-name{
    margin:10px 0;
    font-weight:600;
}
.badge{
    display:inline-block;
    font-size:12px;
    padding:6px 10px;
    border-radius:20px;
    background:rgba(37,99,235,.2);
}
#fileList{
    max-height:320px;
    overflow-y:auto;
}
@keyframes bgMove{
0%{background-position:0% 50%}
50%{background-position:100% 50%}
100%{background-position:0% 50%}
}
</style>
</head>
<body>

<div class="container">

<!-- MAIN PASSWORD LOCK -->
<div id="lockPage">
    <h1><i class="fa-solid fa-lock"></i> Secure Access</h1>
    <p>Enter Password To Open Site</p>

    <input type="password" id="mainPassword" placeholder="Enter Password">
    <button class="blue" onclick="unlockSite()">Enter Site</button>

    <p id="lockMsg"></p>
</div>

<!-- SITE -->
<div id="siteContent" class="hidden">

<!-- MENU -->
<div id="menuPage">
    <h1><i class="fa-solid fa-cloud-arrow-down"></i> Premium Vault</h1>
    <p>Professional Download Platform</p>

    <div class="stats">
        <div class="card">
            <h3>Total Files</h3>
            <span id="totalFiles">0</span>
        </div>

        <div class="card">
            <h3>Total Downloads</h3>
            <span id="totalDownloads">0</span>
        </div>
    </div>

    <button class="blue" onclick="openPasswordPage()">Admin Panel</button>
    <button class="green" onclick="openUserPanel()">User Panel</button>
</div>

<!-- ADMIN LOGIN -->
<div id="passwordPage" class="hidden">
    <h1>Admin Login</h1>
    <p>Secure Access Required</p>

    <input type="password" id="adminPassword" placeholder="Enter Password">
    <button class="blue" onclick="checkPassword()">Login</button>
    <button class="gray" onclick="goHome()">Back</button>

    <p id="passStatus"></p>
</div>

<!-- ADMIN -->
<div id="adminPage" class="hidden">
    <h1>Admin Dashboard</h1>
    <p>Add New Download File</p>

    <input type="text" id="fileName" placeholder="File Name">
    <input type="text" id="fileCategory" placeholder="Category">
    <input type="text" id="fileLink" placeholder="Direct Download Link">

    <button class="green" onclick="addFile()">Add File</button>
    <button class="red" onclick="clearAll()">Clear All Files</button>
    <button class="gray" onclick="goHome()">Back</button>

    <p id="adminStatus"></p>
</div>

<!-- USER -->
<div id="userPage" class="hidden">
    <h1>User Panel</h1>
    <p>Available Premium Files</p>

    <input type="text" id="searchBox" placeholder="Search files..." onkeyup="loadFiles()">

    <div id="fileList"></div>

    <button class="gray" onclick="goHome()">Back</button>
</div>

</div>
</div>

<script>
/* DATA */
let files = JSON.parse(localStorage.getItem('files')) || [];
let totalDownloads = Number(localStorage.getItem('downloads')) || 0;

/* MAIN SITE PASSWORD */
const SITE_PASSWORD = "root2008";

/* SAVE */
function saveFiles(){
    localStorage.setItem('files', JSON.stringify(files));
    localStorage.setItem('downloads', totalDownloads);
    updateStats();
}

/* STATS */
function updateStats(){
    totalFiles.innerText = files.length;
    totalDownloads.innerText = totalDownloads;
}

/* FIRST LOCK SCREEN */
function unlockSite(){
    let pass = document.getElementById("mainPassword").value;

    if(pass === SITE_PASSWORD){
        document.getElementById("lockPage").classList.add("hidden");
        document.getElementById("siteContent").classList.remove("hidden");
        goHome();
        startIdleTimer();
    }else{
        document.getElementById("lockMsg").innerText = "Wrong Password ❌";
    }
}

/* PAGE CONTROL */
function hideAll(){
    ["menuPage","passwordPage","adminPage","userPage"].forEach(id=>{
        document.getElementById(id).classList.add("hidden");
    });
}

function goHome(){
    hideAll();
    menuPage.classList.remove("hidden");
    updateStats();
}

function openPasswordPage(){
    hideAll();
    passwordPage.classList.remove("hidden");
}

function openUserPanel(){
    hideAll();
    userPage.classList.remove("hidden");
    loadFiles();
}

/* ADMIN PASSWORD */
function checkPassword(){
    let pass = adminPassword.value;

    if(pass === "987654321"){
        hideAll();
        adminPage.classList.remove("hidden");
        passStatus.innerText = "";
    }else{
        passStatus.innerText = "Wrong Password ❌";
    }
}

/* ADD FILE */
function addFile(){
    let name = fileName.value.trim();
    let category = fileCategory.value.trim();
    let link = fileLink.value.trim();

    if(!name || !category || !link){
        adminStatus.innerText = "Fill all fields";
        return;
    }

    files.push({name,category,link});
    saveFiles();

    fileName.value="";
    fileCategory.value="";
    fileLink.value="";

    adminStatus.innerText = "File Added Successfully ✅";
}

/* LOAD FILES */
function loadFiles(){
    let list = fileList;
    let search = searchBox.value.toLowerCase();

    let filtered = files.filter(file =>
        file.name.toLowerCase().includes(search)
    );

    if(filtered.length === 0){
        list.innerHTML = "No Files Found";
        return;
    }

    list.innerHTML = "";

    filtered.forEach(file=>{
        list.innerHTML += `
        <div class="file-box">
            <div class="badge">${file.category}</div>
            <div class="file-name">${file.name}</div>
            <a href="${file.link}" target="_blank" onclick="increaseDownload()">
                <button class="green">Download Now</button>
            </a>
        </div>`;
    });
}

/* DOWNLOAD */
function increaseDownload(){
    totalDownloads++;
    saveFiles();
}

/* CLEAR */
function clearAll(){
    files = [];
    saveFiles();
    adminStatus.innerText = "All Files Deleted ✅";
}

/* 20 SEC AUTO CLOSE TAB */
let idleTimer;

function startIdleTimer(){
    resetIdle();

    ["mousemove","keydown","click","scroll","touchstart"].forEach(evt=>{
        document.addEventListener(evt, resetIdle);
    });
}

function resetIdle(){
    clearTimeout(idleTimer);

    idleTimer = setTimeout(()=>{
        window.open('','_self');
        window.close();

        document.body.innerHTML = `
        <div style="background:#000;color:#fff;height:100vh;display:flex;justify-content:center;align-items:center;font-family:Arial">
        <div style="text-align:center">
        <h1>Session Closed</h1>
        <p>20 Seconds No Activity</p>
        </div>
        </div>`;
    },20000);
}
</script>

</body>
</html>
